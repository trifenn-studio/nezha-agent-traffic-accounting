name: Build Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: AArch64
    env:
      ARCH: ${{ matrix.arch }}
      ELF_MACHINE: ${{ matrix.machine }}
      BINARY: nezha-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Build static Agent
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          go mod verify
          version="2.4.0-trifenn+$GITHUB_SHA"
          go build -mod=readonly -trimpath -buildvcs=true \
            -ldflags "-s -w -X github.com/nezhahq/agent/pkg/monitor.Version=$version -X main.arch=$ARCH" -o "dist/package/$BINARY" ./cmd/agent
      - name: Verify and package
        shell: bash
        run: |
          binary="dist/package/$BINARY"
          export LC_ALL=C
          readelf -hW "$binary" | grep -F "ELF64"
          readelf -hW "$binary" | grep -F "$ELF_MACHINE"
          if readelf -lW "$binary" | grep -F 'INTERP'; then
            exit 1
          fi
          if readelf -dW "$binary" | grep -F '(NEEDED)'; then
            exit 1
          fi
          cp LICENSE* dist/package/
          if [[ -f NOTICE ]]; then
            cp NOTICE dist/package/
          fi
          printf 'Source: %s/%s/tree/%s\nCommit: %s\nPlatform: linux/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SHA" "$ARCH" \
            > dist/package/BUILD-INFO.txt
          (cd dist/package && sha256sum "$BINARY" > SHA256SUMS)
          tar -C dist/package -czf "dist/$BINARY-linux-$ARCH.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BINARY }}-linux-${{ matrix.arch }}
          path: dist/${{ env.BINARY }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30
